appId: fr.defilordi.app
productName: DefilOrdi
copyright: DefilOrdi
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asarUnpack: []
win:
  # Livraison : uniquement l'installeur complet (NSIS hors ligne).
  # Le portable n'est fabriqué qu'à la demande (npm run dist:portable).
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DefilOrdi
  artifactName: DefilOrdi-Installation-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  language: '1036'
portable:
  artifactName: DefilOrdi-Portable-${version}.${ext}
