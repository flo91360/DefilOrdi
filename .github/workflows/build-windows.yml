name: Windows .exe

# Une seule construction par envoi : les branches passent par leur PR,
# main par l'envoi (publication de la Release). Une autre branche peut être
# construite à la main (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Tout l'historique et les tags : nécessaires au journal des modifications.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Une PR qui change la version doit décrire ses changements dans
      # changements.md, sinon le journal reprendrait le titre de la carte.
      - name: Vérifier la description des changements
        if: github.event_name == 'pull_request'
        shell: bash
        run: node scripts/verifier-changements.mjs "origin/${{ github.base_ref }}"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Tests de parcours dans Chromium (interface seule, sans Electron).
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Journal des modifications : une section par tag v<version>, plus la
      # version de package.json si elle n'est pas encore publiée.
      - name: Produire le journal des modifications
        shell: bash
        run: node scripts/changelog.mjs dist

      - uses: actions/upload-artifact@v4
        with:
          name: DefilOrdi-windows
          path: |
            dist/DefilOrdi-Installation-*.exe
            dist/NOTES.md
            dist/CHANGELOG.md
          if-no-files-found: error

      # Une nouvelle version de package.json arrivée sur main est publiée dans
      # les Releases (v<version>), avec les .exe à télécharger. Une version déjà
      # publiée n'est jamais remplacée : PlaniFiKateur archive chaque Release
      # dans Google Drive et refuse d'écraser une version existante.
      - name: Lire la version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Vérifier si la version est déjà publiée
        id: published
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "Version v${{ steps.version.outputs.version }} déjà publiée : rien à publier. Augmenter version dans package.json pour une nouvelle Release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Créer le tag de la version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "DefilOrdi ${{ steps.version.outputs.version }}" "${{ github.sha }}"
          git push origin "refs/tags/v${{ steps.version.outputs.version }}"

      - name: Préparer les notes de version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published.outputs.exists == 'false'
        shell: bash
        run: |
          {
            echo "Télécharger **DefilOrdi-Installation-${{ steps.version.outputs.version }}.exe** et l'ouvrir pour installer ou mettre à jour DefilOrdi."
            echo "Au premier lancement, si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* puis *Exécuter quand même*."
            echo
            echo "# Modifications"
            echo
            tail -n +2 dist/NOTES.md
          } > dist/release-body.md

      - name: Publier la version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DefilOrdi ${{ steps.version.outputs.version }}
          body_path: dist/release-body.md
          files: |
            dist/DefilOrdi-Installation-*.exe
            dist/CHANGELOG.md

      # CHANGELOG.md à la racine du dépôt : recopié sur main après chaque
      # Release. Un push fait avec GITHUB_TOKEN ne relance pas la CI, et
      # scripts/changelog.mjs ignore ce commit dans le journal.
      - name: Mettre à jour CHANGELOG.md sur main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published.outputs.exists == 'false'
        shell: bash
        run: |
          for essai in 1 2 3 4; do
            git fetch origin main
            git checkout -B journal origin/main
            cp dist/CHANGELOG.md CHANGELOG.md
            git add CHANGELOG.md
            if git diff --cached --quiet; then
              echo "CHANGELOG.md déjà à jour."
              exit 0
            fi
            git commit -m "Journal des modifications : version ${{ steps.version.outputs.version }} [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((essai * 5))
          done
          echo "Impossible de pousser CHANGELOG.md sur main."
          exit 1
