name: Windows .exe

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: DefilOrdi-windows
          path: dist/DefilOrdi-Installation-*.exe
          if-no-files-found: error

      # Une nouvelle version de package.json arrivée sur main est publiée dans
      # les Releases (v<version>), avec les .exe à télécharger. Une version déjà
      # publiée n'est jamais remplacée : PlaniFiKateur archive chaque Release
      # dans Google Drive et refuse d'écraser une version existante.
      - name: Lire la version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Vérifier si la version est déjà publiée
        id: published
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "Version v${{ steps.version.outputs.version }} déjà publiée : rien à publier. Augmenter version dans package.json pour une nouvelle Release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier la version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DefilOrdi ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Télécharger **DefilOrdi-Installation-${{ steps.version.outputs.version }}.exe** (installeur complet).
            Au premier lancement, si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* puis *Exécuter quand même*.
          files: dist/DefilOrdi-Installation-*.exe
          fail_on_unmatched_files: true
