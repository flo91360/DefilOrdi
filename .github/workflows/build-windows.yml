name: Windows .exe

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: DefilOrdi-windows
          path: |
            dist/DefilOrdi-Installation-*.exe
            dist/DefilOrdi-Portable-*.exe
          if-no-files-found: error

      # Chaque mise à jour de main publie (ou remplace) la version
      # v<version de package.json> dans les Releases, avec les .exe à télécharger.
      - name: Lire la version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publier la version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DefilOrdi ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Télécharger **DefilOrdi-Installation-${{ steps.version.outputs.version }}.exe** (recommandé) ou la version portable.
            Au premier lancement, si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* puis *Exécuter quand même*.
          files: |
            dist/DefilOrdi-Installation-*.exe
            dist/DefilOrdi-Portable-*.exe

  publish-drive:
    name: Archiver sur Google Drive
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: drive-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DefilOrdi-windows
          path: drive-artifacts
      - uses: flo91360/PlaniFiKateur/.github/actions/publish-drive@fc4c6b4e9e778dbee9b89d91db2a39d24a949b4a
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          folder-id: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          version: v${{ needs.build.outputs.version }}
          artifact-dir: drive-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
